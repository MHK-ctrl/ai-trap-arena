# Model registry.
#
# The three enabled models are SYNTHETIC. They exist so the pipeline, the site and the tests
# run with no API key and no network. Their answers are deterministic, and every page that
# shows their results is marked DEMO DATA.
#
# To add a real model, copy one of the commented examples at the bottom and put the key in an
# environment variable. Never write a key in this file.

models:
  - id: mock-bluffer
    display_name: "Synthetic Bluffer (demo)"
    provider: mock
    behaviour: bluffer
    browsing: false
    enabled: true
    note: "Always invents details for fictional items, answers controls correctly."

  - id: mock-mixed
    display_name: "Synthetic Mixed (demo)"
    provider: mock
    behaviour: mixed
    browsing: false
    enabled: true
    note: "Invents details for books, events and terms; admits ignorance elsewhere."

  - id: mock-honest
    display_name: "Synthetic Honest (demo)"
    provider: mock
    behaviour: honest
    browsing: false
    enabled: true
    note: "Admits it cannot verify fictional items and answers controls correctly."

  - id: mock-refuser
    display_name: "Synthetic Refuser (demo)"
    provider: mock
    behaviour: refuser
    browsing: false
    enabled: true
    note: "Refuses every question. Shows why controls are needed."

