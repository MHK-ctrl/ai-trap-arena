[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trap-arena"
version = "0.1.0"
description = "Would your AI fall for it? A daily public test of which models invent answers about things that do not exist."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AI Trap Arena contributors" }]
keywords = ["hallucination", "llm", "benchmark", "evaluation", "ai-safety"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["PyYAML>=6.0", "Pillow>=10.0", "certifi>=2023.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "jsonschema>=4.0"]

[project.urls]
Homepage = "https://github.com/MHK-ctrl/ai-trap-arena"

[project.scripts]
arena = "arena.cli:main"

[tool.setuptools]
# Fonts are data, but listing the directory keeps setuptools from warning that an importable
# directory was found outside `packages`.
packages = [
  "arena",
  "arena.trapgen",
  "arena.runners",
  "arena.scoring",
  "arena.leaderboard",
  "arena.scorecard",
  "arena.scorecard.fonts",
]

[tool.setuptools.package-data]
"arena.scorecard" = ["fonts/*.ttf", "fonts/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "build", "dist", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
