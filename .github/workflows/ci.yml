name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests (network mocked)
        run: pytest -q
      - name: Scorer agreement against the gold set
        run: arena score data/gold/answers.jsonl --gold
      - name: Validate every committed trap against the JSON schema and data rules
        run: python -c "from tests.test_repo_safety import test_daily_traps_are_verified_and_fictional as t; t(); print('committed traps are verified and fictional')"
      - name: Submission schema
        run: arena check-submission data/submissions/example.json --offline
      - name: Site builds from committed data
        run: arena site --help >/dev/null && echo "cli ok"
